services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: autopeer
      POSTGRES_USER: autopeer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopeer"]
      interval: 10s
      timeout: 5s
      retries: 5

  center:
    build:
      context: .
      args:
        COMMIT_HASH: ${COMMIT_HASH:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VERSION: ${VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - releases:/var/lib/autopeer-center/releases
      - cache:/var/lib/autopeer-center/cache
      - keys:/var/lib/autopeer-center
    restart: unless-stopped

  # Optional: ClickHouse backs the DN42 traffic-sampling analytics. Omit this
  # service (and leave CLICKHOUSE_URL empty) to run without traffic analytics —
  # center degrades gracefully. When enabled, set in .env:
  #   CLICKHOUSE_URL=clickhouse://autopeer:changeme@clickhouse:9000/autopeer
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: autopeer
      CLICKHOUSE_USER: autopeer
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - chdata:/var/lib/clickhouse
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  releases:
  cache:
  keys:
  chdata:
