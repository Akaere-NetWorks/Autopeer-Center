services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: autopeer
      POSTGRES_USER: autopeer
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopeer"]
      interval: 10s
      timeout: 5s
      retries: 5

  center:
    build:
      context: .
      args:
        COMMIT_HASH: ${COMMIT_HASH:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        VERSION: ${VERSION:-dev}
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - releases:/var/lib/autopeer-center/releases
      - cache:/var/lib/autopeer-center/cache
      - keys:/var/lib/autopeer-center
    restart: unless-stopped

volumes:
  pgdata:
  releases:
  cache:
  keys:
